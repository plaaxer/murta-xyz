<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felipe Murta | Plaxer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <p class="label">Visitors</p>
    <p class="count" id="visitor-count">—</p>
  </main>

  <script>
    const API_URL = "https://hwbqd27i55.execute-api.us-east-2.amazonaws.com/count";

    fetch(API_URL)
      .then(res => res.json())
      .then(data => {
        document.getElementById("visitor-count").textContent = data.count;
      })
      .catch(() => {
        document.getElementById("visitor-count").textContent = "N/A";
      });
  </script>
</body>
</html>
